# Simulates CI/CD's SECOND push -- an update to the same logical agent
# (same two labels), reached by simply applying this alongside v1, exactly
# as CI/CD would after a code push bumps the image tag / build number.
#
# Apply this file WHILE v1 (10-agent-v1.yaml) is still applied and Ready.
# The controller will detect two Deployments sharing
# (blueprint-id=bp-8891, agent-name=stock-research-agent), and drive:
#   wait for v2 Ready -> mint+register new agent id -> deregister old
#   agent id -> delete stock-research-agent-v1
#
# Do NOT delete v1 yourself -- that's the controller's job, and doing it
# manually defeats the point of the demo.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: stock-research-agent-v2
  namespace: ubs-poc
  labels:
    ubs.io/blueprint-id: bp-8891
    ubs.io/agent-name: stock-research-agent
spec:
  replicas: 1
  selector:
    matchLabels: { app: stock-research-agent, version: v2 }
  template:
    metadata:
      labels: { app: stock-research-agent, version: v2 }
    spec:
      containers:
        - name: agent
          image: nginx:1.27   # "new version" of the agent workload
          ports: [{ containerPort: 80 }]
          readinessProbe:
            httpGet: { path: /, port: 80 }
            initialDelaySeconds: 2
            periodSeconds: 3
