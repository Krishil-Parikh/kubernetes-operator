apiVersion: apps/v1
kind: Deployment
metadata:
  name: mock-ubs-api
  namespace: ubs-poc-v2
spec:
  replicas: 1
  selector:
    matchLabels: { app: mock-ubs-api }
  template:
    metadata:
      labels: { app: mock-ubs-api }
    spec:
      containers:
        - name: mock-api
          image: ubs-poc/mock-api:latest
          imagePullPolicy: IfNotPresent
          ports: [{ containerPort: 5000 }]
          readinessProbe:
            httpGet: { path: /health, port: 5000 }
            initialDelaySeconds: 2
            periodSeconds: 3
---
apiVersion: v1
kind: Service
metadata:
  name: mock-ubs-api
  namespace: ubs-poc-v2
spec:
  selector: { app: mock-ubs-api }
  ports: [{ port: 5000, targetPort: 5000 }]
