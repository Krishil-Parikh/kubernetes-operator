# Stand-in for the real blueprint token UBS would provision per-blueprint.
# In production this is created by the platform, never by the developer,
# and never committed to a manifest -- referenced only via secretRef.
apiVersion: v1
kind: Secret
metadata:
  name: bp-8891-token
  namespace: ubs-poc-v2
type: Opaque
stringData:
  BLUEPRINT_TOKEN: "poc-demo-token-not-real"
